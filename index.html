<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- CSP di-inject saat build oleh plugin di vite.config.js (SEC-03) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Portfolio Michael Christian Handoko dalam bentuk desktop Windows 95. Dibuat dengan tangan.">
  <link rel="icon" type="image/x-icon" href="/icon/computer.ico">
  <!-- SEC-04: Subresource Integrity — browser menolak file CDN yang hash-nya berubah -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!--
    Kucing interaktif (webneko.net) — loader dipindah ke file eksternal
    (/neko-loader.js) agar CSP tidak butuh 'unsafe-inline' untuk skrip.
    Toggle tersedia di app Control Panel. Default: kucing AKTIF.
  -->
  <script src="/neko-loader.js"></script>
</head>
<body>
<div id="app"><script type="module" src="/src/main.js"></script></div>
</body>
</html>
